[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-firecrawl"
version = "0.1.0"
description = "An integration package connecting Firecrawl and LangChain"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.4.0,<2.0.0",
    # firecrawl-py 4.28.2 is runtime-verified; the v2 client (`Firecrawl`,
    # aliased as `FirecrawlApp`) exposes scrape/batch_scrape/crawl/map/extract/
    # agent/search with the `integration` kwarg. 4.13.0 is the first release with
    # the full `agent` signature (max_credits, strict_constrain_to_urls, model).
    "firecrawl-py>=4.13.0,<5.0.0",
]

[project.urls]
Homepage = "https://www.firecrawl.dev"
Documentation = "https://docs.langchain.com/oss/python/integrations/providers/firecrawl"
Repository = "https://github.com/firecrawl/langchain-firecrawl"
Issues = "https://github.com/firecrawl/langchain-firecrawl/issues"
Changelog = "https://github.com/firecrawl/langchain-firecrawl/releases"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-benchmark",
    "pytest-xdist>=3.6.1,<4.0.0",
    "freezegun>=1.2.2,<2.0.0",
    "syrupy>=5.0.0,<6.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-tests>=1.1.9,<2.0.0",
]
lint = ["ruff>=0.13.1,<0.14.0"]
dev = ["langchain-core>=1.4.0,<2.0.0"]
test_integration = []
typing = [
    "mypy>=1.10.0,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
]


[tool.uv]
constraint-dependencies = ["pygments>=2.20.0"]  # CVE-2026-4539

# Standalone partner package: langchain-core and langchain-tests are pulled from
# PyPI (no monorepo path sources).

[tool.mypy]
disallow_untyped_defs = "True"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "E",      # pycodestyle error
    "EM",     # flake8-errmsg
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FBT",    # flake8-boolean-trap
    "FLY",    # flake8-flynt
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INT",    # flake8-gettext
    "ISC",    # isort-comprehensions
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PERF",   # flake8-perf
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-rst-docstrings
    "RUF",    # ruff
    "S",      # flake8-bandit
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warning
    "YTT",    # flake8-2020
]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "S112",    # Rarely useful
    "RUF012",  # Doesn't play well with Pydantic
    "SLF001",  # Private member access
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--snapshot-warn-unused --strict-markers --strict-config --durations=5"
markers = [
    "requires: mark tests as requiring a specific library",
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # Tests need assertions
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]
"scripts/*.py" = [
    "INP001",   # Not a package
]
