name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "true"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Lint (ruff, format, mypy, import rules)
        run: make lint
      - name: Check imports
        run: make check_imports

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --group test
      - name: Unit tests, including the LangChain standard tests
        run: make test
      - name: Integration tests compile
        run: uv run --group test --group test_integration pytest -m compile tests/integration_tests

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Skip when FIRECRAWL_API_KEY is not configured
        if: env.FIRECRAWL_API_KEY == ''
        run: echo "::notice::FIRECRAWL_API_KEY secret is not available, skipping integration tests."
      - uses: actions/checkout@v5
        if: env.FIRECRAWL_API_KEY != ''
      - uses: astral-sh/setup-uv@v7
        if: env.FIRECRAWL_API_KEY != ''
        with:
          python-version: "3.12"
          enable-cache: true
      - if: env.FIRECRAWL_API_KEY != ''
        run: uv sync --group test --group test_integration
      - name: Integration tests, including the LangChain standard tests
        if: env.FIRECRAWL_API_KEY != ''
        run: make integration_tests
